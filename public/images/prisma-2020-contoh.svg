<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 772" width="1240" height="772" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Contoh diagram alir PRISMA 2020 dalam bahasa Indonesia</title>
<desc id="d">Dari 838 rekaman basis data dan 19 rekaman dari penelusuran sitasi, setelah penghapusan duplikat, penyaringan judul dan abstrak, serta penilaian teks lengkap, 36 studi dimasukkan dalam review. Angka bersifat ilustratif.</desc>
